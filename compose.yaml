services:
  app-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cs_manager
      POSTGRES_USER: cs_manager
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["app-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs_manager -d cs_manager"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Defina KEYCLOAK_DB_PASSWORD}
    volumes: ["keycloak-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Defina KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?Defina KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_ADMIN_URL:-http://localhost:8082}
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8082:8080"]
    volumes: ["./infra/keycloak/cs-manager-realm.json:/opt/keycloak/data/import/cs-manager-realm.json:ro"]
    depends_on:
      keycloak-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; read -r line <&3; [[ $$line == *200* ]]'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  auth:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./infra/keycloak/public.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      keycloak: {condition: service_healthy}
  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://app-db:5432/cs_manager
      DB_USER: cs_manager
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/cs-manager
      KEYCLOAK_JWKS: http://keycloak:8080/realms/cs-manager/protocol/openid-connect/certs
      CORS_ORIGINS: ${FRONTEND_URL:-http://localhost:4200}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-disabled}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_TIMEOUT: ${AI_TIMEOUT:-20s}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1000}
      AI_MAX_RECORDS: ${AI_MAX_RECORDS:-50}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-10}
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      app-db: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081; printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3; read -r line <&3; [[ $$line == *200* ]]'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  frontend:
    build: ../cs-player-front
    environment:
      API_URL: ${API_PUBLIC_URL:-http://localhost:8081/api}
      KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
    ports: ["127.0.0.1:4200:80"]
    depends_on:
      api: {condition: service_healthy}
      auth: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ && wget -q --spider http://127.0.0.1/config.json"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  app-data:
  keycloak-data:
