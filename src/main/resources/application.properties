spring.application.name=cs-player-api
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cs_manager}
spring.datasource.username=${DB_USER:cs_manager}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
app.security.issuer=${KEYCLOAK_ISSUER:http://localhost:8080/realms/cs-manager}
app.security.jwk-set-uri=${KEYCLOAK_JWKS:http://localhost:8080/realms/cs-manager/protocol/openid-connect/certs}
app.security.audience=cs-manager-api
app.security.origins=${CORS_ORIGINS:http://localhost:4200}
app.ai.enabled=${AI_ENABLED:false}
app.ai.requests-per-minute=${AI_REQUESTS_PER_MINUTE:10}
app.ai.max-records=${AI_MAX_RECORDS:50}
spring.ai.openai.api-key=${AI_API_KEY:disabled}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.options.model=${AI_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.options.max-tokens=${AI_MAX_TOKENS:1000}
spring.ai.openai.chat.options.temperature=0
spring.ai.openai.max-retries=0
spring.ai.openai.timeout=${AI_TIMEOUT:20s}
